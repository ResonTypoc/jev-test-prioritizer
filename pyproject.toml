[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-test-prioritizer"
version = "0.1.0"
description = "Advisory test retention evaluation with Jev"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["typesafe-sdk>=0.7.2,<0.8"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
jev-test-prioritizer = "jev_test_prioritizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
